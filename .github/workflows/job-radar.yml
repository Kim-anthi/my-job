name: job radar

# Times are UTC. These four land at 07:00, 12:00, 16:00 and 20:00 EAT (UTC+3),
# so the morning run catches anything posted overnight.
on:
  schedule:
    - cron: "0 4,9,13,17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Match and log, but send nothing"
        type: boolean
        default: false

permissions:
  contents: write

# Never let two runs race on the same job memory.
concurrency:
  group: job-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: radar
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The worker is dependency-free, so there is no install step.

      # The SQLite file is what stops repeat notifications. It lives in the
      # Actions cache rather than the repo: committing a binary database four
      # times a day would add hundreds of MB to the repo over a year. A new key
      # per run is deliberate - cache entries are immutable, and restore-keys
      # picks up the most recent one. Worst case (cache evicted) is one batch of
      # repeat alerts, capped by notify.max_per_run.
      - name: Restore job memory
        uses: actions/cache@v4
        with:
          path: radar/data/radar.db
          key: job-radar-db-${{ github.run_id }}
          restore-keys: |
            job-radar-db-

      - name: Run the radar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m jobradar run --dry-run
          else
            python -m jobradar run
          fi

      - name: Prune old rows
        if: inputs.dry_run != true
        run: python -m jobradar prune

      # latest.json is text, diffs cleanly, and is what the Flutter app reads.
      - name: Commit the job feed
        if: inputs.dry_run != true
        run: |
          git config user.name "job-radar"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest.json
          if git diff --quiet --cached -- data/latest.json; then
            echo "no feed changes"
          else
            git commit -m "chore(radar): refresh job feed [skip ci]"
            git push
          fi
